<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Animation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f2f5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .contact-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  /* Contact Me Button & Pulse Animation */
  .contact-btn {
    background-color: #fff;
    border: 2px solid #333;
    padding: 10px 25px;
    border-radius: 20px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 60px;
    position: relative;
    z-index: 2;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  /* Icons Container and Layout */
  .icons-wrapper {
    position: relative;
    width: 300px;
    height: 100px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .icon-btn {
    width: 50px;
    height: 50px;
    background-color: #fff;
    border: 2px solid #333;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    color: #333;
    text-decoration: none;
    position: absolute;
    transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    z-index: 2;
  }

  /* Final positions based on the sketch */
  .icon-f { left: 0; bottom: 50px; }
  .icon-m1 { left: 50%; transform: translateX(-50%); bottom: 0; }
  .icon-m2 { right: 0; bottom: 20px; }

  /* Connector Line */
  .connector-line {
    position: absolute;
    bottom: 25px;
    left: 25px;
    height: 40px;
    /* Path for the curved line from f to m2 */
    width: 250px;
    border-bottom: 5px solid #333;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    z-index: 1;
    transform-origin: left center;
    transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* Initial State (Hidden behind 'f') */
  .contact-container:not(:hover) .icon-m1,
  .contact-container:not(:hover) .icon-m2 {
    left: 0;
    bottom: 50px;
    transform: translateX(0) scale(0.5);
    opacity: 0;
  }

  .contact-container:not(:hover) .connector-line {
    width: 0;
    opacity: 0;
  }

  /* Staggered Animation Delays for a smooth slide effect */
  .contact-container:hover .icon-m1 {
    transition-delay: 0.1s;
  }
  .contact-container:hover .icon-m2 {
    transition-delay: 0.2s;
  }

</style>
</head>
<body>

<div class="contact-container">
  <button class="contact-btn">Contact me</button>

  <div class="icons-wrapper">
    <div class="connector-line"></div>

    <a href="#" class="icon-btn icon-f">
      <i class="fab fa-facebook-f"></i>
    </a>

    <a href="#" class="icon-btn icon-m1">
      <i class="fas fa-envelope"></i>
    </a>

    <a href="#" class="icon-btn icon-m2">
      <i class="fab fa-linkedin-in"></i>
    </a>
  </div>
</div>

</body>
</html>
